# Two jobs, and only the first is *the* gate: `verify` is the same command people run
# locally, mirrored rather than restated, so the two cannot drift. The second,
# `contrast`, is the check deliberately kept out of `verify` because it is far too
# slow for the pre-commit hook — the comment above that job has the reasoning.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20, and the reason is load-bearing rather than housekeeping.
          # `@supabase/realtime-js` reaches for a global `WebSocket`, which Node
          # only exposes unflagged from 22 — on 20 it throws "Node.js detected
          # but native WebSocket not found" and takes three syncClient tests
          # with it. That failure is invisible locally, where Node is newer, so
          # `npm run verify` passes on the desk and fails here. Pinning below 22
          # reintroduces it.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # The second gate, and the reason the comment at the top says "one gate" only of
  # `verify`. This walk needs a web export and a browser — minutes, not seconds —
  # so `check:contrast` is deliberately outside `npm run verify`, which has to stay
  # fast enough that the pre-commit hook can run it. Outside the hook it was run by
  # hand or not at all; here it runs on every push, in parallel with `verify`, so a
  # palette change that puts text under WCAG AA in either theme reddens the PR.
  contrast:
    name: contrast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 for the same reason as above.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir .expo-web
      # A pinned Chromium rather than the runner image's Chrome: the browser
      # computes the colours this gate asserts on, so it should not change
      # underneath the gate when GitHub refreshes the image.
      - run: npx playwright-core install --with-deps chromium
      - run: |
          CHROME_PATH="$(node -e "const { chromium } = require('playwright-core'); console.log(chromium.executablePath())")" \
            npm run check:contrast

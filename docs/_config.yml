title: Cornerstone
description: A study app for CFA and FRM candidates. Nothing leaves your device.

# Needed for absolute URLs in the generated sitemap. The site is served from a
# project path, not the user root, so both halves have to be here.
url: https://singhalsachin2003.github.io
baseurl: /CornerStone

# jekyll-sitemap writes /sitemap.xml on every build, which is what Search Console
# and Bing Webmaster are given. It is on GitHub Pages' supported-plugins list, so
# it runs on their build without a Gemfile.
plugins:
  - jekyll-sitemap

# The public site exists to serve the privacy policy Play Console links to.
# The release checklist and store-listing draft are working notes, not pages —
# still readable in the repo, just not published as a website.
exclude:
  - RELEASE_CHECKLIST.md
  - STORE_LISTING.md
  # Play Console answers and the reviewer promo code: filing notes, moved out of
  # PRIVACY.md on 2026-10-19 so they are not published.
  - PLAY_CONSOLE.md
  # Added 2026-09-18, having been published by accident for a day: PRICING.md is
  # the same kind of working note, written after this list and never added to it.
  # It carries the price bands, the markets overridden down and the reasoning —
  # a page for us, not for candidates.
  - PRICING.md

# Jekyll skips dot-directories by default, which would silently drop the App Links
# statement from the published site. It is served at /CornerStone/.well-known/
# rather than the host root, so Android will not read it there — see
# scripts/check-applinks.ts — but publishing it is still what makes the file
# verifiable at the URL it is copied from.
include:
  - .well-known

# Every Markdown page (including the privacy and account-deletion pages, which have
# no layout of their own) is wrapped in _layouts/default.html. The landing page opts
# out with `layout: null`; get/index.html has no front matter so it is served as-is.
defaults:
  - scope:
      path: ""
    values:
      layout: default
